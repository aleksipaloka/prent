<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{page_layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div layout:fragment="main-content">
    <div id="error-message" style="color: red; display: none;">
        Invalid username or password.
    </div>
    <div id="logout-message" style="color: green; display: none;">
        You have been logged out.
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username"> User Name</label>
            <input type="text" class="form-control" name="username" id="username" required />
        </div>
        <div class="form-group">
            <label for="password"> Password </label>
            <input type="password" class="form-control" id="password" name="password" required />
        </div>
        <div><button type="submit" class="btn btn-primary">Sign In</button></div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);

        // Εμφάνιση μηνύματος αν ο χρήστης έχει αποσυνδεθεί
        if (urlParams.has("logout")) {
            document.getElementById("logout-message").style.display = "block";
        }
    });

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault(); // Αποτροπή προεπιλεγμένης συμπεριφοράς της φόρμας

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            console.log("Login success:", data);

            // Αποθήκευση JWT token
            localStorage.setItem("jwtToken", data.token);

            // Ανακατεύθυνση στον πίνακα ελέγχου ή σε άλλη σελίδα
            window.location.href = "/dashboard";
        } else {
            document.getElementById("error-message").style.display = "block";
        }
    });
</script>

</body>
</html>
